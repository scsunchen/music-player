<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA（路径动态计算） -->
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一起听" />
    <script>
      // 动态计算基础路径，支持任意部署目录
      const BASE = new URL('.', window.location.href).pathname.replace(/\/$/, '') + '/'
      // 设置 manifest 链接
      const manifestLink = document.createElement('link')
      manifestLink.rel = 'manifest'
      manifestLink.href = BASE + 'manifest.json'
      manifestLink.id = 'manifest-link'
      document.head.appendChild(manifestLink)
      // 设置 apple-touch-icon
      const iconLink = document.createElement('link')
      iconLink.rel = 'apple-touch-icon'
      iconLink.href = BASE + 'pwa-icons/icon-192.png'
      document.head.appendChild(iconLink)
      // 开发模式下移除 manifest，避免报错
      if (window.location.hostname.includes('localhost')) {
        manifestLink.remove()
      }
    </script>

    <title>一起听 · 听见时光</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // 注册 Service Worker（仅生产环境）
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost')) {
        window.addEventListener('load', () => {
          const base = new URL('.', window.location.href).pathname
          navigator.serviceWorker.register(base + 'sw.js')
            .then((reg) => {
              console.log('Service Worker 注册成功', reg.scope)
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    window.location.reload()
                  }
                })
              })
            })
            .catch((err) => console.log('Service Worker 注册失败', err))
        })
      }
    </script>
  </body>
</html>
