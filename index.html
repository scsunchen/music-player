<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/music-player/manifest.json" id="manifest-link" />
    <meta name="theme-color" content="#667eea" />
    <script>
      // 开发模式下移除 manifest 链接，避免报错
      if (window.location.hostname.includes('localhost')) {
        const manifestLink = document.getElementById('manifest-link')
        if (manifestLink) manifestLink.remove()
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一起听" />
    <link rel="apple-touch-icon" href="/music-player/pwa-icons/icon-192.png" />

    <title>一起听 · 听见时光</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // 注册 Service Worker（仅生产环境）
      if ('serviceWorker' in navigator && !window.location.hostname.includes('localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/music-player/sw.js')
            .then((reg) => {
              console.log('Service Worker 注册成功', reg.scope)
              // 检测更新，自动刷新
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'activated') {
                    // 新 SW 已激活，刷新页面加载最新资源
                    window.location.reload()
                  }
                })
              })
            })
            .catch((err) => console.log('Service Worker 注册失败', err))
        })
      }
    </script>
  </body>
</html>
